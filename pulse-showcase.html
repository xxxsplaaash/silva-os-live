<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Studio Pulse Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Syne:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/pulse_showcase.css">
</head>
<body>
<main class="pulse-shell" data-mode="social_hierarchy_lab">
  <header class="pulse-topbar">
    <div class="pulse-brand">
      <span class="pulse-mark" aria-hidden="true"></span>
      <div>
        <h1>Studio Pulse</h1>
        <p>Public runtime showcase</p>
      </div>
    </div>
    <div class="pulse-runtime" aria-live="polite">
      <span class="runtime-dot" id="runtime-dot"></span>
      <span id="runtime-label">Checking runtime</span>
    </div>
  </header>

  <section class="mode-strip" aria-label="Showcase mode">
    <button class="mode-button active" type="button" data-mode="social_hierarchy_lab">Social Hierarchy Lab</button>
    <button class="mode-button" type="button" data-mode="continuity_breaker">Continuity Breaker</button>
    <button class="reset-button" type="button" id="reset-session">Reset</button>
  </section>

  <section class="pulse-layout">
    <section class="room-panel" aria-label="Room feed">
      <div class="room-head">
        <div>
          <span class="eyebrow">Room</span>
          <h2 id="room-mode-title">Social Hierarchy Lab</h2>
        </div>
        <div class="room-metrics">
          <span id="room-mood">Mood: focused</span>
          <span id="response-mode">Mode: single</span>
        </div>
      </div>
      <div class="room-feed" id="room-feed" aria-live="polite"></div>
      <form class="room-input" id="room-form">
        <label class="sr-only" for="user-text">Message</label>
        <textarea id="user-text" maxlength="500" rows="2" placeholder="Enter the room"></textarea>
        <div class="processing-status" id="processing-status" aria-live="polite">Room is processing the turn.</div>
        <div class="input-actions">
          <span id="char-count">0/500</span>
          <button type="submit" id="send-turn">Send</button>
        </div>
      </form>
    </section>

    <aside class="ledger-panel" aria-label="Runtime and continuity ledger">
      <section class="ledger-section">
        <div class="section-title">Runtime</div>
        <dl class="status-list">
          <div><dt>Engine</dt><dd id="engine-value">--</dd></div>
          <div><dt>Persistence</dt><dd id="persistence-value">--</dd></div>
          <div><dt>Turn</dt><dd id="turn-state-value">waiting</dd></div>
          <div><dt>Room</dt><dd id="room-signal-value">--</dd></div>
          <div><dt>Continuity</dt><dd id="continuity-value">--</dd></div>
          <div><dt>Session</dt><dd id="session-value">--</dd></div>
        </dl>
        <div class="signal-meter" aria-hidden="true">
          <span id="tension-fill"></span>
        </div>
        <div class="signal-meter continuity-meter" aria-hidden="true">
          <span id="continuity-fill"></span>
        </div>
      </section>

      <section class="ledger-section">
        <div class="section-title">Social Dynamics</div>
        <div class="hierarchy-list" id="hierarchy-list"></div>
        <div class="dynamics-list" id="dynamics-list"></div>
      </section>

      <section class="ledger-section">
        <div class="section-title">Presence</div>
        <div class="presence-list" id="presence-list"></div>
      </section>

      <section class="ledger-section ledger-scroll">
        <div class="section-title">Continuity Ledger</div>
        <div class="ledger-list" id="ledger-list"></div>
      </section>
    </aside>
  </section>
</main>
<script src="/assets/pulse_showcase.js" defer></script>
</body>
</html>
